<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RescuAR - Analizator Ran</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            background: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            margin: 0; 
            color: var(--text-light);
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            margin-top: 0.5rem;
            font-weight: 300;
        }

        .card { 
            background: var(--card-bg); 
            padding: 2rem; 
            border-radius: 24px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center; 
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .image-preview-container {
            width: 100%;
            height: 200px;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            background: rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .image-preview-container.has-image {
            border-style: solid;
            border-color: rgba(255, 255, 255, 0.1);
        }

        #imagePreview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .preview-placeholder {
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .preview-placeholder i {
            font-size: 2rem;
            color: rgba(255, 255, 255, 0.2);
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn-upload {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 0.5rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-upload:hover, .btn-upload:active {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn-upload i {
            font-size: 1.5rem;
            color: var(--primary);
        }

        .btn-analyze { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 1rem; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 1.1rem; 
            font-weight: 800;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            width: 100%;
            font-family: 'Outfit', sans-serif;
            margin-top: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-analyze:disabled {
            background: #475569;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
            opacity: 0.7;
        }

        .btn-analyze:not(:disabled):hover, .btn-analyze:not(:disabled):active { 
            background: var(--primary-hover); 
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -3px rgba(59, 130, 246, 0.5);
        }

        .result-panel {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 12px;
            background: rgba(0,0,0,0.2);
            font-size: 1.1rem;
            font-weight: 600;
            display: none;
            animation: fadeIn 0.5s ease;
            text-align: left;
        }

        .result-panel.success {
            border-left: 4px solid var(--success);
            color: var(--text-light);
        }

        .result-panel.error {
            border-left: 4px solid var(--danger);
            color: #fca5a5;
        }

        .loader-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(4px);
            border-radius: 16px;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
            z-index: 10;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>RescuAR</h1>
        <p>AI Wound Analyzer</p>
    </div>

    <div class="card">
        <p style="margin:0; font-size: 0.95rem; color: var(--text-muted);">Take a photo of the wound or select one from your gallery to have it analyzed.</p>

        <div class="image-preview-container" id="previewContainer">
            <div class="preview-placeholder" id="previewPlaceholder">
                <i class="fas fa-image"></i>
                <span>No photo selected</span>
            </div>
            <img id="imagePreview" alt="Podgląd rany">
            
            <div class="loader-overlay" id="loaderOverlay">
                <div class="spinner"></div>
                <span style="font-weight: 600; font-size: 0.9rem;">Analysis in progress...</span>
            </div>
        </div>
        
        <div class="actions">
            <input type="file" id="cameraInput" accept="image/*" capture="environment">
            <label for="cameraInput" class="btn-upload" onclick="playClick()">
                <i class="fas fa-camera"></i>
                Take a picture
            </label>

            <input type="file" id="galleryInput" accept="image/*">
            <label for="galleryInput" class="btn-upload" onclick="playClick()">
                <i class="fas fa-folder-open"></i>
                From the gallery
            </label>
        </div>

        <button class="btn-analyze" id="analyzeBtn" onclick="analyze()" disabled>
            <i class="fas fa-microscope"></i> Analyze the photo
        </button>

        <div id="resultPanel" class="result-panel"></div>
    </div>
</div>

<script>
    let selectedFile = null;

    let currentSteps = [];
    let currentStepIndex = 0;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.continuous = true;
        recognition.interimResults = false;

        recognition.onresult = function(event) {
            const last = event.results.length - 1;
            const command = event.results[last][0].transcript.trim().toLowerCase();
            console.log("Recognized command:", command);

            if (command.includes("continue") || command.includes("next") || command.includes("one")) {
                nextStep();
            } else if (command.includes("repeat") || command.includes("again") || command.includes("two")) {
                repeatStep();
            } else if (command.includes("clarify") || command.includes("details") || command.includes("three")) {
                clarifyStep();
            }
        };

        recognition.onerror = function(event) {
            console.log("Recognition error:", event.error);
        };

        recognition.onend = function() {
            if (currentStepIndex < currentSteps.length) {
                try { recognition.start(); } catch(e) {}
            }
        }
    }

    function startListening() {
        if (recognition) {
            try { recognition.start(); console.log("Listening has begun..."); } catch (e) {}
        }
    }

    function stopListening() {
        if (recognition) { recognition.stop(); }
    }

    function renderStep() {
        const stepContainer = document.getElementById('stepContainer');
        if (!stepContainer) return;

        if (currentStepIndex < currentSteps.length) {
            stepContainer.innerHTML = `
                <div style="margin-top: 15px; text-align: left; background: rgba(0,0,0,0.25); padding: 15px; border-radius: 12px; border-left: 4px solid #60a5fa;">
                    <strong style="color: #60a5fa; font-size: 0.9rem;">KROK ${currentStepIndex + 1} Z ${currentSteps.length}</strong>
                    <p style="margin: 10px 0; font-size: 1.05rem; font-weight: 400; line-height: 1.4;">${currentSteps[currentStepIndex]}</p>

                    <div style="margin-top: 15px; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Dostępne komendy:</div>
                    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px;">
                        <button onclick="nextStep()" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 10px; border-radius: 8px; cursor: pointer; text-align: left; font-family: 'Outfit'; font-size: 0.95rem; transition: background 0.2s;"><i class="fas fa-arrow-right" style="color: #60a5fa; width: 24px;"></i> 1. Continue</button>
                        <button onclick="repeatStep()" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 10px; border-radius: 8px; cursor: pointer; text-align: left; font-family: 'Outfit'; font-size: 0.95rem; transition: background 0.2s;"><i class="fas fa-redo" style="color: #10b981; width: 24px;"></i> 2. Repeat</button>
                        <button onclick="clarifyStep()" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 10px; border-radius: 8px; cursor: pointer; text-align: left; font-family: 'Outfit'; font-size: 0.95rem; transition: background 0.2s;"><i class="fas fa-question-circle" style="color: #f59e0b; width: 24px;"></i> 3. Clarify...</button>
                    </div>
                    <div style="margin-top: 15px; color: #10b981; font-size: 0.85rem; display: flex; align-items: center; gap: 8px;">
                        <i class="fas fa-microphone" style="animation: pulse 1.5s infinite;"></i> Możesz też wydać komendę głosowo...
                    </div>
                </div>
            `;
            startListening();
        } else {
            stepContainer.innerHTML = `
                <div style="margin-top: 20px; text-align: center; color: var(--text-light); padding: 15px; background: rgba(16, 185, 129, 0.1); border-radius: 12px; border: 1px solid rgba(16, 185, 129, 0.2);">
                    <i class="fas fa-check-circle" style="font-size: 2rem; color: #10b981; margin-bottom: 10px; display: block;"></i>
                    All first aid steps have been completed!
                </div>
            `;
            stopListening();
        }
    }

    function nextStep() { playClick(); currentStepIndex++; renderStep(); }
    function repeatStep() { playClick(); renderStep(); }
    function clarifyStep() { playClick(); alert("Funkcja 'Doprecyzuj' zostanie wkrótce dodana."); }

    // Elementy UI
    const cameraInput = document.getElementById('cameraInput');
    const galleryInput = document.getElementById('galleryInput');
    const imagePreview = document.getElementById('imagePreview');
    const previewContainer = document.getElementById('previewContainer');
    const previewPlaceholder = document.getElementById('previewPlaceholder');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const resultPanel = document.getElementById('resultPanel');
    const loaderOverlay = document.getElementById('loaderOverlay');

    function playClick() {
        if (navigator.vibrate) {
            navigator.vibrate(50);
        }
    }

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (file) {
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = function(e) {
                imagePreview.src = e.target.result;
                imagePreview.style.display = 'block';
                previewPlaceholder.style.display = 'none';
                previewContainer.classList.add('has-image');
                analyzeBtn.disabled = false;
                resultPanel.style.display = 'none';
            }
            reader.readAsDataURL(file);
        }
    }

    cameraInput.addEventListener('change', handleFileSelect);
    galleryInput.addEventListener('change', handleFileSelect);

    async function analyze() {
        if (!selectedFile) return;

        playClick();
        const formData = new FormData();
        formData.append('file', selectedFile);

        resultPanel.style.display = 'none';
        resultPanel.className = 'result-panel';
        loaderOverlay.style.display = 'flex';
        analyzeBtn.disabled = true;

        try {
            const response = await fetch('/analyze', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            loaderOverlay.style.display = 'none';
            analyzeBtn.disabled = false;
            
            resultPanel.style.display = 'block';
            if (response.ok && data.diagnosis) {
                resultPanel.classList.add('success');

                currentSteps = data.steps || [];
                currentStepIndex = 0;

                resultPanel.innerHTML = `
                    <div style="font-size: 1.2rem; margin-bottom: 10px;">
                        <i class="fas fa-check-circle" style="color: #10b981; margin-right: 8px;"></i>
                        <span style="text-transform: capitalize;">${data.diagnosis}</span>
                    </div>
                    <div id="stepContainer"></div>
                `;

                renderStep();
            } else {
                resultPanel.classList.add('error');
                resultPanel.innerHTML = `<i class="fas fa-exclamation-triangle" style="color: #ef4444; margin-right: 8px;"></i> ${data.error || "Nieznany błąd"}`;
            }
        } catch (error) {
            loaderOverlay.style.display = 'none';
            analyzeBtn.disabled = false;
            resultPanel.style.display = 'block';
            resultPanel.classList.add('error');
            resultPanel.innerHTML = `<i class="fas fa-wifi" style="color: #ef4444; margin-right: 8px;"></i> Błąd połączenia z serwerem.`;
        }
    }
</script>


</body>
</html>
