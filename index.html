<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Wound Analyzer</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #f0f2f5; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; }
        h1 { color: #1a73e8; }
        input[type="file"] { margin: 20px 0; }
        button { background-color: #1a73e8; color: white; border: none; padding: 12px 24px; border-radius: 5px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background-color: #1557b0; }
        #result { margin-top: 20px; font-size: 1.2rem; font-weight: bold; color: #333; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #1a73e8; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: none; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <h1>Analizator Ran</h1>
    <p>Wgraj zdjęcie, aby sprawdzić czy to poparzenie czy rozcięcie.</p>
    
    <input type="file" id="imageInput" accept="image/*">
    <br>
    <button onclick="analyze()">Analizuj zdjęcie</button>

    <div id="loader" class="loader"></div>
    <div id="result"></div>
</div>

<script>
    async function analyze() {
        const fileInput = document.getElementById('imageInput');
        const resultDiv = document.getElementById('result');
        const loader = document.getElementById('loader');

        if (!fileInput.files[0]) {
            alert("Wybierz zdjęcie!");
            return;
        }

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        // Interfejs użytkownika
        resultDiv.innerText = "";
        loader.style.display = "block";

        try {
            // !!! TUTAJ WKLEISZ ADRES Z RENDER.COM PO WDROŻENIU !!!
            const response = await fetch('https://resuar.onrender.com', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            loader.style.display = "none";
            
            if (data.diagnosis) {
                resultDiv.innerText = "Wynik: " + data.diagnosis;
            } else {
                resultDiv.innerText = "Błąd: " + (data.error || "Nieznany błąd");
            }
        } catch (error) {
            loader.style.display = "none";
            resultDiv.innerText = "Błąd połączenia z serwerem.";
        }
    }
</script>

</body>
</html>
