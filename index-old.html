<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RescuAR - Analizator Ran</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            background: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            margin: 0; 
            color: var(--text-light);
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            margin-top: 0.5rem;
            font-weight: 300;
        }

        .card { 
            background: var(--card-bg); 
            padding: 2rem; 
            border-radius: 24px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center; 
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .image-preview-container {
            width: 100%;
            height: 200px;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            background: rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .image-preview-container.has-image {
            border-style: solid;
            border-color: rgba(255, 255, 255, 0.1);
        }

        #imagePreview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .preview-placeholder {
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .preview-placeholder i {
            font-size: 2rem;
            color: rgba(255, 255, 255, 0.2);
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn-upload {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 0.5rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-upload:hover, .btn-upload:active {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn-upload i {
            font-size: 1.5rem;
            color: var(--primary);
        }

        .btn-analyze { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 1rem; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 1.1rem; 
            font-weight: 800;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            width: 100%;
            font-family: 'Outfit', sans-serif;
            margin-top: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-analyze:disabled {
            background: #475569;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
            opacity: 0.7;
        }

        .btn-analyze:not(:disabled):hover, .btn-analyze:not(:disabled):active { 
            background: var(--primary-hover); 
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -3px rgba(59, 130, 246, 0.5);
        }

        .result-panel {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 12px;
            background: rgba(0,0,0,0.2);
            font-size: 1.1rem;
            font-weight: 600;
            display: none;
            animation: fadeIn 0.5s ease;
            text-align: left;
        }

        .result-panel.success {
            border-left: 4px solid var(--success);
            color: var(--text-light);
        }

        .result-panel.error {
            border-left: 4px solid var(--danger);
            color: #fca5a5;
        }

        .loader-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(4px);
            border-radius: 16px;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
            z-index: 10;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        input[type="file"] { display: none; }

    .chat-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 350px;
        overflow-y: auto;
        margin-top: 20px;
        padding: 15px;
        background: #f8fafc;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
    }

    .chat-bubble {
        max-width: 85%;
        padding: 10px 14px;
        border-radius: 16px;
        font-size: 15px;
        line-height: 1.4;
        animation: fadeIn 0.3s ease-out;
        word-wrap: break-word;
    }

    /* Dymek Asystenta (Lewa strona, niebieski) */
    .chat-bubble.ai {
        align-self: flex-start;
        background-color: #e0f2fe;
        color: #0369a1;
        border-bottom-left-radius: 4px;
    }

    /* Dymek Użytkownika (Prawa strona, zielony) */
    .chat-bubble.user {
        align-self: flex-end;
        background-color: #10b981;
        color: white;
        border-bottom-right-radius: 4px;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>RescuAR</h1>
        <p>AI Wound Analyzer</p>
    </div>

    <div class="card">
        <p style="margin:0; font-size: 0.95rem; color: var(--text-muted);">Zrób zdjęcie rany lub wybierz z galerii, aby dokonać analizy.</p>

        <div class="image-preview-container" id="previewContainer">
            <div class="preview-placeholder" id="previewPlaceholder">
                <i class="fas fa-image"></i>
                <span>Brak zdjęcia</span>
            </div>
            <img id="imagePreview" alt="Podgląd rany">
            
            <div class="loader-overlay" id="loaderOverlay">
                <div class="spinner"></div>
                <span style="font-weight: 600; font-size: 0.9rem;">Analiza w toku...</span>
            </div>
        </div>
        
        <div class="actions">
            <input type="file" id="cameraInput" accept="image/*" capture="environment">
            <label for="cameraInput" class="btn-upload" onclick="playClick()">
                <i class="fas fa-camera"></i>
                Zrób zdjęcie
            </label>

            <input type="file" id="galleryInput" accept="image/*">
            <label for="galleryInput" class="btn-upload" onclick="playClick()">
                <i class="fas fa-folder-open"></i>
                Z galerii
            </label>
        </div>

        <button class="btn-analyze" id="analyzeBtn" onclick="analyze()" disabled>
            <i class="fas fa-microscope"></i> Analizuj zdjęcie
        </button>

        <div id="resultPanel" class="result-panel"></div>
    </div>

    <div id="chatContainer" class="chat-container" style="display: none;"></div>
</div>

<script>
    let selectedFile = null;

    // Elementy UI
    const cameraInput = document.getElementById('cameraInput');
    const galleryInput = document.getElementById('galleryInput');
    const imagePreview = document.getElementById('imagePreview');
    const previewContainer = document.getElementById('previewContainer');
    const previewPlaceholder = document.getElementById('previewPlaceholder');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const resultPanel = document.getElementById('resultPanel');
    const loaderOverlay = document.getElementById('loaderOverlay');
    let scenarioArray = [];
    let currentScenarioIndex = 0;
    let recognitionText = null;
    let audioContext = null;
    let mediaRecorder = null;
    let audioChunks = [];
    const messageHistory = [];
    let isChatMode = false;

    function playClick() {
        if (navigator.vibrate) {
            navigator.vibrate(50);
        }
    }

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (file) {
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = function(e) {
                imagePreview.src = e.target.result;
                imagePreview.style.display = 'block';
                previewPlaceholder.style.display = 'none';
                previewContainer.classList.add('has-image');
                analyzeBtn.disabled = false;
                resultPanel.style.display = 'none';
            }
            reader.readAsDataURL(file);
        }
    }

    cameraInput.addEventListener('change', handleFileSelect);
    galleryInput.addEventListener('change', handleFileSelect);

function addChatBubble(text, sender) {
    const chatContainer = document.getElementById('chatContainer');
    if (chatContainer.style.display === 'none') chatContainer.style.display = 'flex';

    const bubble = document.createElement('div');
    bubble.classList.add('chat-bubble', sender);
    const icon = sender === 'ai' ? '<i class="fas fa-robot"></i> ' : '<i class="fas fa-user"></i> ';
    bubble.innerHTML = icon + text;
    chatContainer.appendChild(bubble);
    chatContainer.scrollTop = chatContainer.scrollHeight;
}

    async function analyze() {
        if (!selectedFile) return;

        playClick();
        const formData = new FormData();
        formData.append('file', selectedFile);

        resultPanel.style.display = 'none';
        resultPanel.className = 'result-panel';
        loaderOverlay.style.display = 'flex';
        analyzeBtn.disabled = true;

        try {
            const response = await fetch('/analyze', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            loaderOverlay.style.display = 'none';
            analyzeBtn.disabled = false;
            
            resultPanel.style.display = 'block';
            if (response.ok && data.diagnosis && data.scenario_array && Array.isArray(data.scenario_array) && data.scenario_array.length > 0) {
                resultPanel.classList.add('success');
                resultPanel.innerHTML = `<i class="fas fa-check-circle" style="color: #10b981; margin-right: 8px;"></i> ${data.diagnosis}`;
                scenarioArray = data.scenario_array;
                console.log("Otrzymane scenario_array:", scenarioArray);
                const welcomeSound = `I recognized a ${data.diagnosis === "Rozcięcie" ? "cut" : "burn"}. I will guide you through the first aid steps. When you finish a step, say "Next". If you have a question, say "More". To hear the step again, say "Repeat". Let's begin.`;
                scenarioArray.unshift(welcomeSound);
                readScenarioStepByStep();
            } else {
                resultPanel.classList.add('error');
                resultPanel.innerHTML = `<i class="fas fa-exclamation-triangle" style="color: #ef4444; margin-right: 8px;"></i> ${data.error || "Nieznany błąd"}`;
            }
        } catch (error) {
            loaderOverlay.style.display = 'none';
            analyzeBtn.disabled = false;
            resultPanel.style.display = 'block';
            resultPanel.classList.add('error');
            resultPanel.innerHTML = `<i class="fas fa-wifi" style="color: #ef4444; margin-right: 8px;"></i> Błąd połączenia z serwerem.`;
        }
    }

    async function getMoreInfo() {
        try {
            const response = await fetch('/more', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ prompt: messageHistory.map(msg => `${msg.sender === 'ai' ? 'AI' : 'User'}: ${msg.text}`).join('\n') })
            });

            if (!response.ok) {
                throw new Error(`Błąd serwera: ${response.status}`);
            }

            const data = await response.json();
            const moreInfoText = data.text || "Brak dodatkowych informacji.";
            addChatBubble(moreInfoText, "ai");
            await getAudio(moreInfoText);

        } catch (error) {
            console.error("Błąd podczas pobierania dodatkowych informacji:", error);
            addChatBubble("Nie udało się pobrać dodatkowych informacji.", "ai");
        }
    }

    async function readScenarioStepByStep() {
    if (!scenarioArray || scenarioArray.length === 0) {
        console.log("Brak scenariuszy do odczytania.");
        return;
    }

    if (currentScenarioIndex >= scenarioArray.length) {
        console.log("Koniec procedury.");
        currentScenarioIndex = 0;
        addChatBubble("Procedura ratunkowa zakończona.", "ai");
        return;
    }

    const currentStepText = scenarioArray[currentScenarioIndex];
    console.log("Odczytywany krok:", currentStepText);
    addChatBubble(currentStepText, "ai");

    //pobranie dźwięku
    await getAudio(currentStepText);
}

async function askGeminiQuestion(userQuestion) {
    try {
        //niewidzialny kontekst kroku do pytania użytkownika.
        let questionForAI = userQuestion;
        
        if (messageHistory.length === 0) {
             const currentStep = scenarioArray[currentScenarioIndex] || "Brak kontekstu";
             questionForAI = `Kontekst kroku: ${currentStep}. Moje pytanie to: ${userQuestion}`;
        }

        //dodajemy zapytanie do historii
        messageHistory.push({
            role: "user",
            parts: [questionForAI]
        });

        const response = await fetch('/more', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ history: messageHistory }) 
        });

        if (!response.ok) throw new Error("Błąd serwera");

        const data = await response.json();
        const answer = data.text || "Błąd odpowiedzi AI.";

        //zapisujemy odpowiedź modelu do historii, żeby pamiętał co powiedział
        messageHistory.push({
            role: "model",
            parts: [answer]
        });

        //dymek i dźwięk
        addChatBubble(answer, "ai");
        await getAudio(answer);

    } catch (error) {
        console.error("Błąd zapytania:", error);
        const errText = "Wystąpił błąd komunikacji. Spróbuj zadać pytanie jeszcze raz lub powiedz next.";
        addChatBubble(errText, "ai");
        await getAudio(errText);
    }
}
    async function getAudio(promptText) {
    try {      
        const audioUrl = `get_audio?prompt=${encodeURIComponent(promptText)}`;

        const audio = new Audio(audioUrl);

        // Co ma się wydarzyć, gdy plik skończy grać?
        audio.onended = () => {
            console.log("Zakończono odtwarzanie kroku.");
            
            startLocalVoiceCommand();
        };

        // Odtwarzamy dźwięk
        audio.play();

    } catch (error) {
        console.error("Błąd podczas generowania audio:", error);
    }


    function startLocalVoiceCommand() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
        resultPanel.innerHTML = `<i class="fas fa-exclamation-triangle" style="color: #ef4444;"></i> Twoja przeglądarka nie obsługuje funkcji rozpoznawania mowy.`;
        return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US'; 
    recognition.continuous = false; 
    recognition.interimResults = false; 

    let commandAnalyze = false; 

    // Zmieniamy komunikat w zależności od trybu
    recognition.onstart = () => {
        if (isChatMode) {
            resultPanel.innerHTML = `<i class="fas fa-microphone" style="color: #3b82f6; animation: pulse 1s infinite;"></i> Q&A mode (Ask a question or say "next")...`;
        } else {
            resultPanel.innerHTML = `<i class="fas fa-microphone" style="color: #ef4444; animation: pulse 1s infinite;"></i> I'm listening (say: "next", "repeat" or "more")...`;
        }
    };

    recognition.onresult = async (event) => {
        if (commandAnalyze) return; 
        commandAnalyze = true; 
        recognition.stop(); 

        let transcript = event.results[0][0].transcript.toLowerCase();
        transcript = transcript.replace(/[.,!?]/g, '').trim();

        console.log("Przeglądarka usłyszała:", transcript);
        resultPanel.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Przetwarzam...`;
        addChatBubble(transcript, "user"); 

        //Q&A mode
        if (isChatMode) {
            if (transcript.includes("next")) {
                // Użytkownik chce wyjść z pytań i przejść dalej
                isChatMode = false; 
                addChatBubble("Zamykam tryb pomocy.", "ai");
                currentScenarioIndex++;
                readScenarioStepByStep(); 
            } else {
                // Jeśli to nie jest "next", traktujemy to jako zadane pytanie do Gemini
                askGeminiQuestion(transcript);
            }
            return;
        }

        //scenarios
        if (transcript.includes("next")) {
            currentScenarioIndex++;
            readScenarioStepByStep();

        } else if (transcript.includes("repeat")) {
            readScenarioStepByStep(); 

        } else if (transcript.includes("more")) {
            // Włączamy tryb czatu
            isChatMode = true; 
            const infoText = "Help mode activated. Ask your question, or say next to continue.";
            addChatBubble(infoText, "ai"); 
            await getAudio(infoText);

        } else if (transcript.includes("stop")) {
            addChatBubble("Procedure stopped.", "ai"); 
            currentScenarioIndex = scenarioArray.length;

        } else {
            const fallbackText = "I didn't understand. Please say next, repeat, or more.";
            addChatBubble(fallbackText, "ai"); 
            await getAudio(fallbackText);
        }
    };

    recognition.onerror = async (event) => {
        if (event.error === 'aborted') return;

        console.error("Błąd rozpoznawania mowy:", event.error);
        if (event.error === 'no-speech') {
            const prompt = isChatMode ? "Waiting for your question, or say next." : "Please say next, repeat, or more.";
            await getAudio(prompt);
        } else {
            resultPanel.innerHTML = `<i class="fas fa-microphone-slash"></i> Błąd mikrofonu: ${event.error}`;
        }
    };

    recognition.start();
}
}
</script>


</body>
</html>
